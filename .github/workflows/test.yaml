name: Tests
on:
  push:
    branches:
      - main
      - 'release-*'
      # TEMPORARY: run CI on this branch without a PR while validating the
      # Docker -> Helm/k3s migration. Remove before opening the PR.
      - '250-e2e-tests---replace-docker-with-k3s'
  pull_request:
    branches:
      - main
      - 'release-*'
  # TEMPORARY: allow manual runs while validating the migration. Remove before PR.
  workflow_dispatch:

env:
  RANCHER_VERSION: head
  CATTLE_SERVER_URL: https://127.0.0.1.sslip.io
  CATTLE_BOOTSTRAP_PASSWORD: password
  KUBECONFIG_PATH: ${{ github.workspace }}/kubeconfig.yaml
  DEV_UI_URL: https://localhost:8005

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1

      - name: Setup Node env
        uses: ./.github/actions/setup

      - name: Start Rancher
        run: .github/scripts/install-rancher.sh ${{ env.RANCHER_VERSION }} ${{ env.CATTLE_SERVER_URL }} ${{ env.CATTLE_BOOTSTRAP_PASSWORD }}

      - name: Deploy Rancher AI charts
        run: .github/scripts/deploy-rancher-ai.sh ${{ env.KUBECONFIG_PATH }}

      - name: Start dev UI
        env:
          API: ${{ env.CATTLE_SERVER_URL }}
        run: |
          nohup yarn dev > dev.log 2>&1 & echo $! > dev.pid

      - name: Wait for dev UI to be ready
        run: |
          npx wait-on ${{ env.DEV_UI_URL }}

      - name: Run Cypress tests
        id: cypress
        continue-on-error: true
        env:
          TEST_USERNAME: admin
          CATTLE_BOOTSTRAP_PASSWORD: ${{ env.CATTLE_BOOTSTRAP_PASSWORD }}
          API: ${{ env.CATTLE_SERVER_URL }}
        run: |
          yarn e2e --browser chrome

      - name: Collect Rancher logs on failure
        if: steps.cypress.outcome != 'success'
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: |
          echo "===== Pods ====="
          kubectl get pods -A || true
          echo "===== Rancher logs ====="
          kubectl -n cattle-system logs -l app=rancher --all-containers --tail=-1 || true
          echo "===== Rancher AI agent logs ====="
          kubectl -n cattle-ai-agent-system logs -l app.kubernetes.io/name=rancher-ai-agent --all-containers --tail=-1 || true

      - name: Upload videos on failure
        if: steps.cypress.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7

      - name: Tear down background processes
        if: always()
        run: |
          if [ -f dev.pid ]; then kill $(cat dev.pid) || true; fi

      - name: Check failed tests
        if: steps.cypress.outcome != 'success'
        run: |
          echo "Cypress tests failed"
          exit 1

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Run tests
        uses: ./.github/actions/unit-tests

  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1

      - name: Run i18n lint
        uses: ./.github/actions/i18n-lint

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1

      - name: Run tests
        uses: ./.github/actions/lint